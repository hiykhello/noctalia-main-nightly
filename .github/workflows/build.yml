name: Nightly Build Noctalia Git (v3)

on:
  schedule:
    - cron: '0 20 * * *'  # 每天北京时间 04:00 (UTC 20:00) 自动检查构建
  workflow_dispatch:      # 支持网页端随时手动一键触发
    inputs:
      force_build:
        description: 'Force build even if no new upstream commit'
        required: false
        type: boolean
        default: false

concurrency:
  group: noctalia-nightly-build
  cancel-in-progress: false # 排队等待而非强杀，防止状态截断

permissions:
  contents: write

jobs:
  check:
    name: Check Upstream Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_msg: ${{ steps.check.outputs.upstream_msg }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Query upstream commit (Authenticated)
        id: check
        run: |
          set -euo pipefail
          COMMIT_DATA=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/noctalia-dev/noctalia/commits/main")
          UPSTREAM_SHA=$(echo "$COMMIT_DATA" | jq -r .sha)
          UPSTREAM_MSG=$(echo "$COMMIT_DATA" | jq -r '.commit.message' | head -n1)

          if [[ -z "$UPSTREAM_SHA" || "$UPSTREAM_SHA" == "null" ]]; then
            echo "❌ 无法获取上游 commit SHA，API 响应异常: $COMMIT_DATA"
            exit 1
          fi
          
          # Check latest release in this repository
          LATEST_RELEASE=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" 2>/dev/null || true)
          LAST_BUILT_SHA=$(echo "$LATEST_RELEASE" | jq -r '.body' | grep -Po '(?<=commit: `)[a-f0-9]{40}' || true)
          
          echo "Upstream SHA:    $UPSTREAM_SHA"
          echo "Last Built SHA:  $LAST_BUILT_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_msg=$UPSTREAM_MSG" >> $GITHUB_OUTPUT
          
          FORCE="${{ inputs.force_build || false }}"
          if [[ "$FORCE" == "true" ]] || [[ "$UPSTREAM_SHA" != "$LAST_BUILT_SHA" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Decision: BUILD NEEDED"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Decision: UP-TO-DATE, SKIPPING"
          fi

  build:
    name: Build & Verify CachyOS v3 Package
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      # Official CachyOS v3 container with AVX2/FMA/BMI2 optimizations
      image: cachyos/cachyos-v3:latest

    steps:
      - name: Setup CachyOS Mirrors, Sandbox & Build Environment
        run: |
          set -euo pipefail
          # 1. 优化 pacman 配置并关闭容器不支持的网络沙箱（消除 ldconfig 报错）
          sed -i 's/^#ParallelDownloads = 5/ParallelDownloads = 10/' /etc/pacman.conf
          sed -i '/\[options\]/a DisableSandboxNetwork' /etc/pacman.conf

          # 2. 配置全球最优 CachyOS v3 与 Arch 镜像源
          echo 'Server = https://us-mnz.soulharsh007.dev/cachyos/repo/$arch/$repo' > /etc/pacman.d/cachyos-mirrorlist
          echo 'Server = https://us-mnz.soulharsh007.dev/cachyos/repo/$arch_v3/$repo' > /etc/pacman.d/cachyos-v3-mirrorlist
          echo 'Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          
          # 3. 单次全量安装工具链与所有编译依赖（避免重复刷新数据库）
          pacman -Syu --noconfirm --needed \
            git sudo base-devel ccache mold clang jq \
            meson ninja pkgconf wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz libxkbcommon glib2 \
            libsecret libsodium sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 md4c tomlplusplus libical \
            nlohmann-json stb jemalloc

          # 4. 创建非 root 构建用户
          id -u builder &>/dev/null || useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # 5. 配置 makepkg: 多核加速、ccache、mold 极速链接器、x86_64_v3 架构与多线程 zstd
          sed -i 's/^#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf
          sed -i 's/^BUILDENV=(!distcc color !ccache check !sign)/BUILDENV=(!distcc color ccache check !sign)/' /etc/makepkg.conf
          sed -i 's/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -)/' /etc/makepkg.conf
          sed -i 's/^LDFLAGS="/LDFLAGS="-fuse-ld=mold /' /etc/makepkg.conf
          sed -i 's/^CARCH="x86_64"/CARCH="x86_64_v3"/' /etc/makepkg.conf

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache ccache directory across builds
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-noctalia-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-noctalia-${{ runner.os }}-

      - name: Setup workspace & ccache permissions
        run: |
          mkdir -p .ccache
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg (CachyOS v3)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_SLOPPINESS: "include_file_mtime,time_macros"
        run: |
          set -euo pipefail
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_BASEDIR="$CCACHE_BASEDIR"
          export CCACHE_NOHASHDIR="$CCACHE_NOHASHDIR"
          export CCACHE_SLOPPINESS="$CCACHE_SLOPPINESS"
          ccache -M 2G
          echo "=== 构建前 ccache 统计 ==="
          ccache -s

          su builder -c "
            export CCACHE_DIR='$CCACHE_DIR'
            export CCACHE_BASEDIR='$CCACHE_BASEDIR'
            export CCACHE_NOHASHDIR='$CCACHE_NOHASHDIR'
            export CCACHE_SLOPPINESS='$CCACHE_SLOPPINESS'
            cd aur-recipe && makepkg -s --noconfirm
          "

          echo "=== 构建后 ccache 统计 ==="
          ccache -s
          
          mkdir -p dist
          PKG_FILE=$(ls aur-recipe/noctalia-git-*.pkg.tar.zst | head -n1)
          cp "$PKG_FILE" dist/noctalia-git-latest-x86_64_v3.pkg.tar.zst
          
          cd dist
          sha256sum noctalia-git-latest-x86_64_v3.pkg.tar.zst > sha256sums.txt
          cd ..

      - name: Extract package version metadata
        id: meta
        run: |
          set -euo pipefail
          PKG_FILE=$(ls aur-recipe/noctalia-git-*.pkg.tar.zst | head -n1)
          VERSION=$(basename "$PKG_FILE" | sed -E 's/^noctalia-git-//;s/-(x86_64|x86_64_v3)\.pkg\.tar\.zst$//')
          REAL_FILENAME=$(basename "$PKG_FILE")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=$REAL_FILENAME" >> $GITHUB_OUTPUT
          echo "Package Version:  $VERSION"
          echo "Package Filename: $REAL_FILENAME"

      # ═════════════════════════════════════════════════════════════════
      # 🧪 5 重严格全量自检 (Any failure immediately aborts release)
      # ═════════════════════════════════════════════════════════════════
      - name: Run Strict Package & Binary Verification Suite
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "🔍 1. 检验 Pacman 包元数据规范性..."
          echo "=================================================="
          PKG_FILE="dist/noctalia-git-latest-x86_64_v3.pkg.tar.zst"
          pacman -Qip "$PKG_FILE"

          echo "=================================================="
          echo "🔍 2. 检验核心可执行文件与资源完整性..."
          echo "=================================================="
          pacman -Qlp "$PKG_FILE" | grep -q '/usr/bin/noctalia$' || { echo "❌ 致命错误: /usr/bin/noctalia 缺失!"; exit 1; }
          pacman -Qlp "$PKG_FILE" | grep -q '/usr/share/applications/.*\.desktop$' || { echo "❌ 致命错误: desktop 入口文件缺失!"; exit 1; }
          pacman -Qlp "$PKG_FILE" | grep -q '/usr/share/noctalia/assets/' || { echo "❌ 致命错误: UI 核心资源文件缺失!"; exit 1; }

          echo "=================================================="
          echo "🔍 3. 容器内模拟实机安装 (pacman -U)..."
          echo "=================================================="
          pacman -U --noconfirm "$PKG_FILE"

          echo "=================================================="
          echo "🔍 4. 扫描动态链接库依赖 (检查有无 missing .so)..."
          echo "=================================================="
          ldd /usr/bin/noctalia
          if ldd /usr/bin/noctalia | grep -i "not found"; then
            echo "❌ 致命错误: 发现缺失的动态链接库 (not found)!"
            exit 1
          fi

          echo "=================================================="
          echo "🔍 5. 运行期冒烟自检测试 (--version / --help)..."
          echo "=================================================="
          /usr/bin/noctalia --version
          /usr/bin/noctalia --help > /dev/null

          echo "=================================================="
          echo "🎉 5 重严格检验 100% 通过！"
          echo "=================================================="

      # ═════════════════════════════════════════════════════════════════
      # 🧹 清理 Release 历史废弃 Asset，防止无限堆积
      # ═════════════════════════════════════════════════════════════════
      - name: Prune Obsolete Release Assets
        run: |
          set -euo pipefail
          echo "=== 正在清理 Release 'latest' 中的历史废弃 Asset ==="
          RELEASE_DATA=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" 2>/dev/null || true)
          
          ASSETS=$(echo "$RELEASE_DATA" | jq -r '.assets[]? | "\(.id) \(.name)"')
          
          if [[ -n "$ASSETS" ]]; then
            while IFS=" " read -r asset_id asset_name; do
              [[ -z "$asset_id" ]] && continue
              # 仅保留白名单（最新构建包与 checksum），其余历史旧版本包直接通过 GitHub API 清理
              if [[ "$asset_name" != "noctalia-git-latest-x86_64_v3.pkg.tar.zst" && "$asset_name" != "sha256sums.txt" ]]; then
                echo "🗑️ 正在删除历史废弃 asset: ${asset_name} (ID: ${asset_id})..."
                curl -sSL -X DELETE \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/assets/${asset_id}" || true
              else
                echo "✓ 保留当前有效 asset: ${asset_name} (ID: ${asset_id})"
              fi
            done <<< "$ASSETS"
          fi
          echo "=== 清理完成 ==="

      # ═════════════════════════════════════════════════════════════════
      # 🚀 零竞态发布与版本信号灯回写
      # ═════════════════════════════════════════════════════════════════
      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Noctalia Git v3 (${{ steps.meta.outputs.version }})"
          make_latest: true
          body: |
            Automated Nightly Build with **CachyOS x86_64_v3** (AVX2/FMA/BMI2) optimizations.
            
            - **Package Version**: `${{ steps.meta.outputs.version }}`
            - **Architecture**: `x86_64_v3` (AVX2/FMA/BMI2 optimized)
            - **Upstream commit**: `${{ needs.check.outputs.upstream_sha }}`
            - **Commit Message**: `${{ needs.check.outputs.upstream_msg }}`
            - **Verification Status**: ✅ 100% Passed (Metadata, File Integrity, ldd, Runtime)
            
            ---
            ### 📦 本地更新说明
            - 本地使用 `noctalia-bin-git`，直接运行常规 **`paru`** 命令即可自动识别最新构建并免编译极速更新。
            - 亦支持单行热装测试：
            ```bash
            run0 pacman -U "https://github.com/${{ github.repository }}/releases/download/latest/noctalia-git-latest-x86_64_v3.pkg.tar.zst"
            ```
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VERSION file on main branch (Signal Paru)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.meta.outputs.version }}" > VERSION
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "chore(release): bump built version to ${{ steps.meta.outputs.version }} [skip ci]"
            git push origin main
            echo "Version updated and pushed to main."
          else
            echo "VERSION already up to date, skipping commit."
          fi
